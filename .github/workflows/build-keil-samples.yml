name: Build Keil Samples

on:
  workflow_dispatch:
    inputs:
      uv4_path:
        description: 'Path to UV4.exe on the self-hosted runner'
        required: false
        default: 'C:\Users\chche\AppData\Local\Keil_v5\UV4\UV4.exe'

jobs:
  build:
    name: Build Selected Keil Samples
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install M55M1BSP Library
        shell: pwsh
        run: |
          $global:bspDir = "M55M1BSP-3.01.004"
          $libDir  = Join-Path $global:bspDir "Library"
          "BSP_DIR=$global:bspDir" | Out-File -FilePath $env:GITHUB_ENV -Append

          if (Test-Path $libDir) {
            Write-Host "BSP Library already exists, skipping download."
          } else {
            $bspVersion = $bspDir.Replace("M55M1BSP-", "")
            $bspUrl     = "https://github.com/OpenNuvoton/M55M1BSP/archive/refs/tags/V${bspVersion}.zip"
            $zipFile    = "${bspDir}.zip"

            Write-Host "Downloading BSP from $bspUrl ..."
            Invoke-WebRequest -Uri $bspUrl -OutFile $zipFile -UseBasicParsing
            Write-Host "Extracting BSP ..."
            Expand-Archive -Path $zipFile -DestinationPath "." -Force
            Remove-Item $zipFile
            Write-Host "BSP installed successfully."
          }

      - name: Build selected Keil samples
        id: build_samples
        shell: pwsh
        run: |
          $uv4 = "${{ github.event.inputs.uv4_path }}"

          if (-not (Test-Path $uv4)) {
            Write-Error "UV4.exe not found at: $uv4"
            exit 1
          }

          $global:bspDir = if ($env:BSP_DIR) { $env:BSP_DIR } else { "M55M1BSP-3.01.004" }
          $targetRoots = @(
            "${global:bspDir}\SampleCode\ComputerVision",
            "${global:bspDir}\SampleCode\NuEdgeWise"
          )

          $projects = @()
          foreach ($root in $targetRoots) {
            if (Test-Path $root) {
              $projects += Get-ChildItem -Path $root -Filter "*.uvprojx" -Recurse -File
            }
          }
          $projects = $projects | Sort-Object FullName

          Write-Host "Found $($projects.Count) Keil project(s) to build under ComputerVision and NuEdgeWise."

          $results  = [System.Collections.Generic.List[PSCustomObject]]::new()
          $failList = [System.Collections.Generic.List[string]]::new()
          $warnList = [System.Collections.Generic.List[string]]::new()

          foreach ($proj in $projects) {
            $ProjectDir = Split-Path -Parent $proj
            $relPath = $proj.FullName.Substring($PWD.Path.Length + 1)
            Write-Host ""
            Write-Host "══════════════════════════════════════════"
            Write-Host " Building: $proj"
            Write-Host "══════════════════════════════════════════"
            $LogFile = Join-Path $ProjectDir "compile.log"

            # UV4 exit codes: 0 = success, 1 = warning, 2 = error, 3 = fatal
            $buildOutput = Start-Process -FilePath $uv4 -ArgumentList "-b `"$($proj.FullName)`" -j0 -o `"$LogFile`"" -Wait -NoNewWindow -PassThru
            $exitCode    = $buildOutput.ExitCode
            #$exitCode    = $LASTEXITCODE
            #$buildOutput | ForEach-Object { Write-Host $_ }
            #Write-Host "Buld detail: $buildOutput" -ForegroundColor Yellow
            $pass = ($exitCode -eq 0)
            $warn = ($exitCode -eq 1)
            $fail = ($exitCode -ge 2)
            if (-not $pass) {
              if (Test-Path $LogFile) {
                  Get-Content $LogFile
              }

              if($fail) {
                $failList.Add($proj.BaseName)
              }

              if($warn) {
                $warnList.Add($proj.BaseName)
              }
            }

            $results.Add([PSCustomObject]@{
              Project  = $proj.BaseName
              Category = ($proj.FullName -split '\\SampleCode\\')[1].Split('\')[0]
              Status   = if ($pass) { "PASS" } else {if ($warn) { "WARN" } else { "FAIL" }}
              ExitCode = $exitCode
            })
          }

          Write-Host ""
          Write-Host "══════════════════════════════════════════"
          Write-Host " Build Summary  ($($projects.Count) projects)"
          Write-Host "══════════════════════════════════════════"
          $results | Format-Table Category, Project, Status, ExitCode -AutoSize

          $passCount = ($results | Where-Object Status -eq "PASS").Count
          $failCount = $failList.Count
          $warnCount = $warnList.Count
          Write-Host "Result: $passCount passed, $failCount failed, $warnCount with warnings."

          if ($failCount -gt 0) {
            Write-Host ""
            Write-Host "Failed projects:"
            $failList | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keil-build-objects
          path: |
            ${{ env.BSP_DIR }}/SampleCode/**/KEIL/Objects/*.axf
            ${{ env.BSP_DIR }}/SampleCode/**/KEIL/Objects/*.bin
            ${{ env.BSP_DIR }}/SampleCode/**/Keil/Objects/*.axf
            ${{ env.BSP_DIR }}/SampleCode/**/Keil/Objects/*.bin
          if-no-files-found: warn
          retention-days: 7
